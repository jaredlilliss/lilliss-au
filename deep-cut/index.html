<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Deep Cut - a diving game about rare answers. Common answers float, rare answers sink. Ten rounds on a simulated demo dataset. Runs entirely in your browser.">
<meta name="robots" content="index,follow">
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plexmono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted, replacing the Google Fonts links the artifact build used. The privacy policy
   on this domain states that the site contacts no third party and invites the reader to
   check the network tab, so a font network here would publish a falsehood. */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;
src:url('/fonts/fraunces.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;font-display:swap;
src:url('/fonts/fraunces-italic.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;
src:url('/fonts/plexmono-400.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
src:url('/fonts/plexmono-500.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;
src:url('/fonts/plexmono-500.woff2') format('woff2')}
</style>
<title>Deep Cut</title>
<style>
:root{
  --ink:#03101c; --ink2:#061a2a; --abyss:#01080f;
  --turq:#54e8d2; --turq-dim:#2b8f84; --turq-deep:#0e3d3d;
  --amber:#f3a33c; --amber-lt:#ffd79a; --amber-deep:#6b4415;
  --bone:#e7f1ef; --mute:#7f9aa3; --mute-dim:#4a6670;
  --alarm:#ff7d5e;
  --rule:rgba(84,232,210,.20);
  --rule-warm:rgba(243,163,60,.24);
  --frame:rgba(231,241,239,.10);
  --ruler-w:66px;
  --kb:0px;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink)}
body{
  font-family:var(--mono);
  color:var(--bone);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
#ocean{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 42%,transparent 48%,rgba(1,8,15,.62) 100%);
  transition:box-shadow .5s ease;
}
#vignette.deep{box-shadow:inset 0 0 180px rgba(84,232,210,.30)}
#vignette.rise{box-shadow:inset 0 0 160px rgba(243,163,60,.18)}

/* NOTE for whoever picks this up (Atelier, 18/09/2026, lilliss.au deployment).
   The title screen's text sits straight on the painted ocean and does not clear AA:
   measured at 1280x860, span.cut 1.08 on the bright horizon, the EXPEDITION label
   1.50, the DEMO FREQUENCIES badge 1.82, the intro paragraph 1.63, the personal-best
   line 1.20, and the three ghost buttons 2.02 to 3.54, against a 4.5 bar. Confirmed
   by eye on the render, not only by the sweep. A depth gradient over the canvas was
   tried and moved almost nothing, because the worst offenders sit where the scene is
   brightest. The real fix is a palette decision on the game's own look -- lifting
   --mute off the water and giving the wordmark's turquoise somewhere darker to sit --
   and that belongs to the game's author, not to the seat that deployed it. Left
   exactly as built, deliberately, with the numbers recorded here. */

/* ---------- shared instrument chrome ---------- */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
#hud > *{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
/* Every panel below sets its own display:flex, which beats the UA [hidden]
   rule on its own. Without this the prompt, sonar and reveal all paint at
   once. The publish skeleton supplies the same rule; this makes the file
   correct standalone too. */
[hidden]{display:none!important}
.screen[hidden]{display:none!important}
.pad{padding:clamp(18px,4vw,40px);padding-right:calc(clamp(18px,4vw,40px) + var(--ruler-w))}

.label{
  font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.20em;text-transform:uppercase;color:var(--mute);
}
.label.warm{color:var(--amber)}
.label.cool{color:var(--turq-dim)}
.hair{height:1px;background:var(--rule);border:0;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* instrument frame: corner ticks, no rounded cards */
.frame{position:relative;border:1px solid var(--frame);background:rgba(3,16,28,.58);backdrop-filter:blur(7px)}
.frame::before,.frame::after{
  content:"";position:absolute;width:11px;height:11px;pointer-events:none;
  border:1px solid var(--turq);opacity:.55;
}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.btn{
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:14px 22px;min-height:48px;border:1px solid var(--turq-dim);color:var(--turq);
  background:linear-gradient(180deg,rgba(84,232,210,.10),rgba(84,232,210,.03));
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .1s ease;
}
.btn:hover{background:rgba(84,232,210,.18);border-color:var(--turq)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  color:var(--ink);border-color:var(--turq);
  background:linear-gradient(180deg,var(--turq),#2fbfae);
  font-size:13px;padding:17px 30px;
}
.btn.primary:hover{background:linear-gradient(180deg,#7ffbe8,#3ed0bd)}
.btn.warm{border-color:var(--amber-deep);color:var(--amber);background:linear-gradient(180deg,rgba(243,163,60,.10),rgba(243,163,60,.02))}
.btn.warm:hover{background:rgba(243,163,60,.18);border-color:var(--amber)}
.btn.ghost{border-color:var(--frame);color:var(--mute);background:none}
.btn.ghost:hover{color:var(--bone);border-color:var(--rule);background:rgba(231,241,239,.05)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.34;cursor:not-allowed;transform:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);border:1px solid var(--rule-warm);padding:5px 9px;background:rgba(243,163,60,.06);
}
.badge .dot{width:5px;height:5px;background:var(--amber);flex:none}
.badge.survey{color:var(--turq);border-color:var(--rule);background:rgba(84,232,210,.06)}
.badge.survey .dot{background:var(--turq)}

/* ---------- title ---------- */
#screen-title{justify-content:center;align-items:flex-start;text-align:left}
.title-wrap{max-width:min(660px,100%);display:flex;flex-direction:column;gap:22px}
.wordmark{
  font-family:var(--display);font-optical-sizing:auto;
  font-weight:800;font-size:clamp(58px,15vw,140px);line-height:.84;letter-spacing:-.035em;
  margin:0;color:var(--bone);text-wrap:balance;
}
.wordmark .cut{display:block;color:var(--turq);font-weight:300;font-style:italic;letter-spacing:-.02em}
.tagline{
  font-family:var(--display);font-weight:300;font-style:italic;
  font-size:clamp(17px,3.4vw,25px);line-height:1.42;color:var(--bone);opacity:.86;margin:0;max-width:30ch;
}
.subline{font-family:var(--mono);font-size:11px;line-height:1.85;color:var(--mute);letter-spacing:.04em;max-width:48ch;margin:0}
.title-rule{display:flex;align-items:center;gap:14px}
.title-rule .hair{flex:1}

/* ---------- tutorial ---------- */
#screen-tutorial{justify-content:center}
.tut-wrap{max-width:min(620px,100%);display:flex;flex-direction:column;gap:20px}
.tut-line{
  font-family:var(--display);font-weight:400;font-size:clamp(23px,5vw,38px);line-height:1.22;
  margin:0;text-wrap:balance;
}
.tut-line em{font-style:italic;color:var(--turq)}
.tut-table{display:flex;flex-direction:column;border:1px solid var(--frame)}
.tut-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--frame)}
.tut-row:last-child{border-bottom:0}
.tut-row .ans{font-family:var(--display);font-size:16px}
.tut-row .pct{font-family:var(--mono);font-size:11px;color:var(--mute)}
.tut-row .chg{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-align:right;min-width:112px}
.up{color:var(--amber)} .down{color:var(--turq)}

/* ---------- play HUD ---------- */
#screen-play{display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#screen-play > *{pointer-events:auto}
.topbar{
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + var(--ruler-w)) 10px 16px;
}
.pips{display:flex;gap:4px;margin-top:8px}
.pip{width:13px;height:3px;background:rgba(231,241,239,.16)}
.pip.down{background:var(--turq)} .pip.up{background:var(--amber)} .pip.now{background:var(--bone)}
.depth-read{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.depth-num{
  font-family:var(--mono);font-weight:600;font-size:clamp(28px,7vw,44px);line-height:1;
  color:var(--amber);letter-spacing:-.02em;
}
.depth-num .m{font-size:.44em;color:var(--amber-deep);margin-left:4px;letter-spacing:.1em}
.zone-read{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--turq-dim);text-transform:uppercase}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 16px;min-height:0}
.prompt-frame{width:min(600px,100%);padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.prompt-text{
  font-family:var(--display);font-optical-sizing:auto;font-weight:400;
  font-size:clamp(25px,5.6vw,42px);line-height:1.14;margin:0;text-wrap:balance;letter-spacing:-.015em;
}
.prompt-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.console{
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  margin-bottom:var(--kb);
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,transparent,rgba(1,8,15,.72) 40%);
  transition:margin-bottom .12s ease;
}
.console-inner{width:min(600px,100%);margin:0 auto;display:flex;flex-direction:column;gap:9px}
.timerbar{position:relative;height:2px;background:rgba(231,241,239,.12);overflow:hidden}
.timerbar span{position:absolute;inset:0 auto 0 0;background:var(--turq);transform-origin:left;transition:background .3s ease}
.timerbar.warn span{background:var(--amber)} .timerbar.crit span{background:var(--alarm)}
.timerrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.answer-row{display:flex;gap:8px;align-items:stretch}
#answer{
  flex:1;min-width:0;font-family:var(--display);font-size:clamp(18px,4.4vw,24px);font-weight:400;
  padding:13px 15px;min-height:52px;color:var(--bone);
  background:rgba(3,16,28,.76);border:1px solid var(--turq-dim);
}
#answer::placeholder{color:var(--mute-dim);font-style:italic}
#answer:focus{border-color:var(--turq);background:rgba(6,26,42,.88)}
#answer.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#submit{flex:none;padding:0 20px}
#anchor-btn{
  display:flex;align-items:center;gap:9px;justify-content:center;width:100%;
  padding:11px 14px;min-height:46px;border:1px solid var(--frame);color:var(--mute);
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  transition:all .2s ease;
}
#anchor-btn:hover:not([disabled]){color:var(--amber);border-color:var(--rule-warm)}
#anchor-btn svg{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
#anchor-btn.armed{color:var(--ink);background:var(--amber);border-color:var(--amber);animation:armed 1.6s ease-in-out infinite}
@keyframes armed{0%,100%{box-shadow:0 0 0 0 rgba(243,163,60,.5)}50%{box-shadow:0 0 0 7px rgba(243,163,60,0)}}
#anchor-btn[disabled]{opacity:.3}
.hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--mute-dim);text-align:center;min-height:13px}

/* ---------- sonar + reveal ---------- */
.sonar-wrap{width:min(600px,100%);display:flex;flex-direction:column;align-items:center;gap:16px}
.sonar-read{font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:var(--turq);text-transform:uppercase}
.sonar-scan{width:min(340px,80%);height:1px;background:var(--rule);position:relative;overflow:hidden}
.sonar-scan::after{
  content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;
  background:linear-gradient(90deg,transparent,var(--turq),transparent);animation:scan 1.1s linear infinite;
}
@keyframes scan{to{left:100%}}

.reveal{width:min(600px,100%);padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.reveal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.reveal-answer{
  font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1.08;
  margin:0;letter-spacing:-.02em;word-break:break-word;
}
.reveal-answer.hit{color:var(--turq)}
.reveal-answer.miss{color:var(--amber-lt)}
.reveal-corrected{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em}
.freq{display:flex;flex-direction:column;gap:7px}
.freq-bar{height:6px;background:rgba(231,241,239,.10);position:relative}
.freq-bar i{position:absolute;inset:0 auto 0 0;background:var(--amber);display:block}
.freq-bar b{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--turq);opacity:.5}
.freq-text{font-family:var(--mono);font-size:11px;color:var(--bone);letter-spacing:.03em}
.freq-text strong{color:var(--amber);font-weight:600}
.change{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.change-num{font-family:var(--mono);font-weight:600;font-size:clamp(34px,9vw,54px);line-height:1;letter-spacing:-.03em}
.change-dir{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.flavour{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(15px,3.4vw,19px);color:var(--bone);opacity:.82;margin:0;text-wrap:balance}
.reveal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--frame)}
.missed{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.04em;line-height:1.7}
.missed b{color:var(--turq);font-weight:500}
.deepcut-stamp{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.34em;color:var(--ink);
  background:var(--turq);padding:5px 10px;align-self:flex-start;
}

/* ---------- results ---------- */
.res-wrap{max-width:min(720px,100%);display:flex;flex-direction:column;gap:20px}
.res-depth{font-family:var(--mono);font-weight:600;font-size:clamp(54px,15vw,110px);line-height:.88;color:var(--amber);letter-spacing:-.04em}
.res-depth .m{font-size:.3em;color:var(--amber-deep);margin-left:8px;letter-spacing:.1em}
.res-crown{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.3em;color:var(--ink);background:var(--turq);padding:6px 12px;align-self:flex-start}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--frame);border:1px solid var(--frame)}
.res-cell{background:rgba(3,16,28,.6);padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.res-cell .v{font-family:var(--display);font-size:19px;line-height:1.2;word-break:break-word}
.res-cell .d{font-family:var(--mono);font-size:12px;font-weight:600}
.rounds{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.rounds th{text-align:left;font-weight:500;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);padding:8px 9px;border-bottom:1px solid var(--rule)}
.rounds td{padding:9px;border-bottom:1px solid var(--frame);vertical-align:top}
.rounds td.a{font-family:var(--display);font-size:14px;color:var(--bone)}
.rounds td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rounds tr.anchored td{background:rgba(243,163,60,.07)}
.tablewrap{overflow-x:auto;border:1px solid var(--frame)}

/* ---------- chart ---------- */
.chart-wrap{max-width:min(720px,100%);display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.tabs{display:flex;gap:0;border:1px solid var(--frame);align-self:flex-start}
.tab{padding:10px 16px;min-height:42px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);border-right:1px solid var(--frame)}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:rgba(84,232,210,.14);color:var(--turq)}
.chart{
  position:relative;flex:1;min-height:340px;border:1px solid var(--frame);overflow:hidden;
  background:linear-gradient(180deg,#0d5670 0%,#0a3a55 18%,#062740 42%,#04182c 68%,#01080f 100%);
}
.chart-grid{position:absolute;inset:0;pointer-events:none}
.chart-grid i{position:absolute;left:0;right:0;height:1px;background:rgba(231,241,239,.07)}
.chart-grid span{position:absolute;right:7px;transform:translateY(-50%);font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:rgba(231,241,239,.34)}
.mark{position:absolute;left:0;right:0;display:flex;align-items:center;gap:9px;padding:0 10px;transform:translateY(-50%)}
.mark .line{flex:1;height:1px;background:rgba(84,232,210,.32)}
.mark .dot{width:8px;height:8px;background:var(--turq);flex:none;transform:rotate(45deg)}
.mark .txt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--bone);white-space:nowrap}
.mark .txt em{color:var(--mute);font-style:normal;font-size:9px;margin-left:6px}
.mark.best .dot{background:var(--amber);width:11px;height:11px}
.mark.best .txt{color:var(--amber);font-weight:600}
.mark.best .line{background:rgba(243,163,60,.42)}
.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--display);font-style:italic;color:var(--mute);font-size:16px}

/* ---------- settings / data ---------- */
.set-wrap{max-width:min(680px,100%);display:flex;flex-direction:column;gap:18px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--frame)}
.set-row .t{display:flex;flex-direction:column;gap:3px}
.set-row .t b{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.set-row .t span{font-family:var(--mono);font-size:10px;color:var(--mute);line-height:1.6}
.toggle{flex:none;width:52px;height:28px;border:1px solid var(--frame);position:relative;background:rgba(231,241,239,.05)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--mute);transition:.18s ease}
.toggle[aria-checked="true"]{border-color:var(--turq-dim);background:rgba(84,232,210,.14)}
.toggle[aria-checked="true"] i{left:27px;background:var(--turq)}
pre.schema{
  font-family:var(--mono);font-size:10.5px;line-height:1.65;color:var(--turq);margin:0;
  padding:14px;border:1px solid var(--frame);background:rgba(1,8,15,.55);overflow-x:auto;white-space:pre;
}
#dataset-paste{
  width:100%;min-height:110px;resize:vertical;font-family:var(--mono);font-size:11px;line-height:1.6;
  padding:11px;color:var(--bone);background:rgba(1,8,15,.62);border:1px solid var(--frame);
}
.notice{font-family:var(--mono);font-size:10.5px;line-height:1.7;padding:10px 12px;border-left:2px solid var(--turq);background:rgba(84,232,210,.06);color:var(--bone)}
.notice.bad{border-left-color:var(--alarm);background:rgba(255,125,94,.07)}
.prose{font-family:var(--mono);font-size:11px;line-height:1.85;color:var(--mute);margin:0}
.prose b{color:var(--bone);font-weight:500}
h2.sec{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:-.02em}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}

/* practice banner */
#practice-flag{
  position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;text-align:center;
  padding:calc(3px + env(safe-area-inset-top,0px)) 8px 3px;
  font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink);background:var(--amber);
}
body.practice .topbar{padding-top:calc(30px + env(safe-area-inset-top,0px))}

@media (max-width:520px){
  :root{--ruler-w:44px}
  .prompt-frame{padding:20px 18px}
  .reveal{padding:18px}
  .depth-num{font-size:clamp(24px,8vw,34px)}
}
body.kb-open .stage{justify-content:flex-start;padding-top:8px}
body.kb-open .prompt-frame{padding:14px 16px}
body.kb-open .prompt-text{font-size:clamp(17px,4.4vw,22px)}
body.kb-open .topbar{padding-top:calc(8px + env(safe-area-inset-top,0px))}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
body.reduced .sonar-scan::after{animation:none;left:0;width:100%;opacity:.5}
body.reduced #anchor-btn.armed{animation:none}

  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  return true;
}

/* ------------------------------- DATASET ---------------------------------
   A question is compiled once into a lookup index. Unknown frequency is NOT
   zero frequency: an answer that is absent is reported as unmeasured, never
   as rare and never as false.                                               */

function compileQuestion(q) {
  const index = new Map();      // normalised key -> answer object
  const collisions = [];
  const total = q.answers.reduce((s, a) => s + a.count, 0);
  const answers = q.answers.map((a, i) => ({
    i,
    canonical: a.canonical,
    count: a.count,
    percent: q.sampleSize > 0 ? (a.count / q.sampleSize) * 100 : 0,
  }));
  // An answer the dataset recorded no responses for is UNMEASURED, not rare.
  // It is kept out of the scoring index entirely so a zero can never be read
  // as maximum rarity, and is resolved through its own path instead.
  const unmeasured = new Map();
  q.answers.forEach((a, i) => {
    const target = a.count > 0 ? index : unmeasured;
    const raws = [a.canonical].concat(Array.isArray(a.aliases) ? a.aliases : []);
    for (const raw of raws) for (const k of keysFor(raw)) {
      if (index.has(k) && index.get(k).i !== i) { collisions.push(k); index.delete(k); continue; }
      if (!index.has(k) && !unmeasured.has(k)) target.set(k, answers[i]);
    }
  });
  const invalid = new Map();
  for (const bad of (q.knownInvalid || [])) {
    for (const k of keysFor(bad.term)) if (!index.has(k)) invalid.set(k, bad);
  }
  const measured = answers.filter(a => a.count > 0);
  return {
    ...q,
    answers,
    index,
    unmeasured,
    invalid,
    collisions,
    listedShare: q.sampleSize > 0 ? (total / q.sampleSize) * 100 : 0,
    deepest: measured.slice().sort((a, b) => a.percent - b.percent)[0] || null,
  };
}

const MATCH = { HIT: "hit", INVALID: "invalid", UNMEASURED: "unmeasured", UNLISTED: "unlisted", TIMEOUT: "timeout" };

function resolveAnswer(cq, raw, allowTypo) {
  const key = norm(raw);
  if (!key) return { kind: MATCH.UNLISTED, key };
  for (const k of keysFor(raw)) {
    const hit = cq.index.get(k);
    if (hit) return { kind: MATCH.HIT, answer: hit, key, corrected: null };
  }
  for (const k of keysFor(raw)) {
    const um = cq.unmeasured.get(k);
    if (um) return { kind: MATCH.UNMEASURED, answer: um, key };
  }
  for (const k of keysFor(raw)) {
    const bad = cq.invalid.get(k);
    if (bad) return { kind: MATCH.INVALID, why: bad.why, key };
  }
  if (allowTypo && key.length >= 6) {
    let found = null, count = 0;
    for (const [k, ans] of cq.index) {
      if (Math.abs(k.length - key.length) > 1) continue;
      if (!editDistanceAtMostOne(k, key)) continue;
      if (found && found.i !== ans.i) { count = 2; break; }
      if (!found) { found = ans; count = 1; }
    }
    if (found && count === 1) return { kind: MATCH.HIT, answer: found, key, corrected: found.canonical };
  }
  return { kind: MATCH.UNLISTED, key };
}

const DATASET_RULES = [
  "datasetVersion must be a non-empty string",
  "sourceType must be 'simulated-demo' or 'human-survey'",
  "questions must be a non-empty array",
  "each question needs id, prompt, category, sampleSize, answers[]",
  "each answer needs canonical (string) and count (number >= 0)",
  "sum of counts must not exceed sampleSize",
];

function validateDataset(data) {
  const errs = [];
  if (!data || typeof data !== "object") return { ok: false, errors: ["Not a JSON object."] };
  if (typeof data.datasetVersion !== "string" || !data.datasetVersion.trim()) errs.push("datasetVersion missing.");
  if (data.sourceType !== "simulated-demo" && data.sourceType !== "human-survey")
    errs.push("sourceType must be 'simulated-demo' or 'human-survey'.");
  if (!Array.isArray(data.questions) || !data.questions.length) errs.push("questions[] missing or empty.");
  if (errs.length) return { ok: false, errors: errs };
  const seen = new Set();
  data.questions.forEach((q, n) => {
    const at = "Question " + (n + 1) + (q && q.id ? " (" + q.id + ")" : "") + ": ";
    if (!q || typeof q !== "object") return errs.push(at + "not an object.");
    if (typeof q.id !== "string" || !q.id) errs.push(at + "id missing.");
    else if (seen.has(q.id)) errs.push(at + "duplicate id."); else seen.add(q.id);
    if (typeof q.prompt !== "string" || !q.prompt) errs.push(at + "prompt missing.");
    if (typeof q.sampleSize !== "number" || !(q.sampleSize > 0)) errs.push(at + "sampleSize must be a positive number.");
    if (!Array.isArray(q.answers) || q.answers.length < 2) return errs.push(at + "needs at least 2 answers.");
    let sum = 0;
    q.answers.forEach(a => {
      if (!a || typeof a.canonical !== "string" || !a.canonical) errs.push(at + "an answer has no canonical.");
      if (typeof a.count !== "number" || a.count < 0) errs.push(at + "answer '" + (a && a.canonical) + "' has a bad count.");
      else sum += a.count;
      if (a && a.aliases != null && !Array.isArray(a.aliases)) errs.push(at + "aliases must be an array.");
    });
    if (typeof q.sampleSize === "number" && sum > q.sampleSize)
      errs.push(at + "counts sum to " + sum + ", above sampleSize " + q.sampleSize + ".");
  });
  if (errs.length) return { ok: false, errors: errs.slice(0, 12) };
  return { ok: true, errors: [] };
}

function prepareDataset(data) {
  const d = JSON.parse(JSON.stringify(data));   // frozen copy for the run
  d.compiled = d.questions.map(compileQuestion);
  d.isDemo = d.sourceType === "simulated-demo";
  return d;
}

/* -------------------------------- STORE ----------------------------------
   Every read and write is guarded: private windows, cleared site data and
   corrupted saves must all degrade to "no records yet", never to a crash.   */
const STORE_KEY = "deepcut.save.v2";
const DATA_KEY = "deepcut.dataset.v2";

const defaultSave = () => ({
  v: 2,
  settings: { sound: true, motion: true, typo: true },
  runs: {},
});

const Store = {
  data: defaultSave(),
  corrupted: false,
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      const p = JSON.parse(raw);
      if (!p || typeof p !== "object" || p.v !== 2 || typeof p.runs !== "object" || p.runs === null) {
        this.corrupted = true; return;
      }
      const s = p.settings && typeof p.settings === "object" ? p.settings : {};
      this.data = {
        v: 2,
        settings: {
          sound: s.sound !== false,
          motion: s.motion !== false,
          typo: s.typo !== false,
        },
        runs: {},
      };
      for (const k of Object.keys(p.runs)) {
        if (!Array.isArray(p.runs[k])) continue;
        this.data.runs[k] = p.runs[k]
          .filter(r => r && typeof r.depth === "number" && isFinite(r.depth) && r.depth >= 0)
          .slice(0, CFG.maxRuns);
      }
    } catch (e) { this.corrupted = true; this.data = defaultSave(); }
  },
  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { /* read-only storage */ }
  },
  bucket(mode, datasetVersion) { return mode + "|" + datasetVersion + "|" + SCORING.id; },
  runsIn(key) { return this.data.runs[key] || []; },
  best(key) { const r = this.runsIn(key); return r.length ? r[0].depth : null; },
  addRun(key, run) {
    const list = this.runsIn(key).slice();
    list.push(run);
    list.sort((a, b) => b.depth - a.depth);
    this.data.runs[key] = list.slice(0, CFG.maxRuns);
    this.save();
    return this.data.runs[key].indexOf(run);
  },
  loadDataset() {
    try {
      const raw = localStorage.getItem(DATA_KEY);
      if (!raw) return null;
      const p = JSON.parse(raw);
      return validateDataset(p).ok ? p : null;
    } catch (e) { return null; }
  },
  saveDataset(d) { try { localStorage.setItem(DATA_KEY, JSON.stringify(d)); } catch (e) {} },
  clearDataset() { try { localStorage.removeItem(DATA_KEY); } catch (e) {} },
};

/* -------------------------------- AUDIO ----------------------------------
   Entirely synthesised: no asset can 404. The context is not created until a
   real user gesture, and every cue is redundant with something on screen.   */
const Audio_ = {
  ctx: null, master: null, ambience: null, filter: null, on: true, started: false,

  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.on ? 0.9 : 0;
      this.master.connect(this.ctx.destination);
      this.startAmbience();
      this.started = true;
    } catch (e) { this.ctx = null; }
  },
  setEnabled(v) {
    this.on = v;
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.05);
  },
  startAmbience() {
    const c = this.ctx;
    const len = c.sampleRate * 3;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {           // brown-ish noise: the sea, not static
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    }
    const src = c.createBufferSource();
    src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 520; f.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = 0.10;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    // a slow swell so the ambience breathes
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 0.035;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    this.ambience = g; this.filter = f;
  },
  /** Deeper water = darker ambience. Called as the ship descends. */
  setDepth(d) {
    if (!this.ctx || !this.filter) return;
    const t = clamp(d / 900, 0, 1);
    this.filter.frequency.setTargetAtTime(lerp(560, 130, t), this.ctx.currentTime, 0.6);
  },
  tone(freq, to, dur, type, vol, delay) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (to && to !== freq) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  ping() { this.tone(1180, 430, 0.55, "sine", 0.16); this.tone(1180, 430, 0.45, "sine", 0.06, 0.34); },
  ui()   { this.tone(520, 620, 0.07, "triangle", 0.10); },
  tick() { this.tone(1500, 1500, 0.035, "square", 0.035); },
  descend(mag) {
    const d = clamp(mag / 100, 0.3, 2);
    this.tone(320, 62, 0.55 + d * 0.5, "triangle", 0.22);
    this.tone(160, 40, 0.75 + d * 0.5, "sine", 0.17, 0.05);
  },
  rise() { this.tone(180, 520, 0.42, "triangle", 0.15); this.tone(360, 900, 0.34, "sine", 0.07, 0.04); },
  penalty() { this.tone(150, 96, 0.34, "sawtooth", 0.11); },
  deepCut() {
    [73.42, 110, 146.83, 220].forEach((f, i) => this.tone(f, f, 2.0, "sine", 0.16, i * 0.09));
    this.tone(1760, 2640, 0.9, "sine", 0.05, 0.3);
    this.tone(2640, 1320, 1.3, "sine", 0.04, 0.55);
  },
  best() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.5, "sine", 0.10, i * 0.075)); },
};

/* -------------------------------- WORLD ----------------------------------
   Procedural, code-drawn, device-pixel-ratio aware. Nothing here is an image
   file, so nothing here can fail to load. The camera is the only link
   between game state and what is painted.                                   */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const WATER = [
  [-400, [ 20,  92, 116]],
  [   0, [ 26, 108, 130]],
  [  60, [ 15,  76, 101]],
  [ 220, [  9,  51,  76]],
  [ 460, [  5,  33,  58]],
  [ 780, [  3,  20,  40]],
  [1150, [  1,  10,  20]],
  [1800, [  1,   5,  11]],
];
function waterRGB(d) {
  let a = WATER[0], b = WATER[WATER.length - 1];
  for (let i = 0; i < WATER.length - 1; i++) {
    if (d >= WATER[i][0] && d <= WATER[i + 1][0]) { a = WATER[i]; b = WATER[i + 1]; break; }
    if (d > WATER[WATER.length - 1][0]) { a = b = WATER[WATER.length - 1]; }
  }
  const t = a[0] === b[0] ? 0 : clamp((d - a[0]) / (b[0] - a[0]), 0, 1);
  return [Math.round(lerp(a[1][0], b[1][0], t)), Math.round(lerp(a[1][1], b[1][1], t)), Math.round(lerp(a[1][2], b[1][2], t))];
}
const rgb = c => "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
const rgba = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";

/** Scenery is generated once per expedition and never regenerated mid-run,
 *  so the world a player descends through is stable and re-findable. */
function buildProps(seed) {
  const rnd = mulberry32(seed);
  const props = [];
  const push = (type, depth, extra) => props.push(Object.assign({ type, depth, x: rnd(), s: 0.7 + rnd() * 0.8, r: rnd() }, extra));
  for (let i = 0; i < 9; i++) push("gull", -140 - rnd() * 240, { sp: 0.25 + rnd() * 0.5 });
  for (let d = 55; d < 240; d += 16 + rnd() * 22) {
    push("kelp", d, { h: 60 + rnd() * 120 });
    if (rnd() > 0.55) push("school", d + rnd() * 10, { n: 6 + Math.floor(rnd() * 9) });
    if (rnd() > 0.82) push("rock", d, {});
  }
  for (let d = 150; d < 330; d += 40 + rnd() * 70) if (rnd() > 0.45) push("wreck", d, {});
  for (let d = 215; d < 500; d += 20 + rnd() * 30) {
    push("jelly", d, { ph: rnd() * 6.28 });
    if (rnd() > 0.7) push("fish", d, {});
  }
  for (let d = 300; d < 620; d += 90 + rnd() * 120) push("whale", d, { sp: 0.06 + rnd() * 0.05 });
  for (let d = 450; d < 820; d += 17 + rnd() * 26) {
    push("biolum", d, { n: 5 + Math.floor(rnd() * 10), ph: rnd() * 6.28 });
    if (rnd() > 0.62) push("angler", d, { ph: rnd() * 6.28 });
  }
  for (let d = 700; d < 900; d += 55 + rnd() * 60) push("spire", d, {});
  for (let d = 790; d < 1500; d += 34 + rnd() * 44) {
    push("ruin", d, { kind: Math.floor(rnd() * 3) });
    if (rnd() > 0.72) push("biolum", d + 8, { n: 6 + Math.floor(rnd() * 8), ph: rnd() * 6.28 });
    if (rnd() > 0.88) push("statue", d, {});
  }
  push("seabed", 1520, {});
  return props.sort((a, b) => a.depth - b.depth);
}

const PARALLAX = {
  gull: 0.5, whale: 0.35, spire: 0.5, ruin: 0.9, statue: 0.8, wreck: 0.85,
  kelp: 1, rock: 0.95, school: 0.8, fish: 0.9, jelly: 0.75, biolum: 0.7,
  angler: 0.8, seabed: 1,
};

const World = {
  cv: null, ctx: null, W: 0, H: 0, dpr: 1,
  props: [], particles: [], bubbles: [], rings: [],
  shipDepth: 0, targetDepth: 0, vel: 0, lead: 0,
  camTop: 0, shipY: 0, shipX: 0,
  pb: null, pbPassed: false,
  reduced: false, buoy: 0, deepFlash: 0, sonar: 0,
  glow: null, t: 0,

  init(cv) {
    this.cv = cv; this.ctx = cv.getContext("2d", { alpha: false });
    this.makeGlow();
    this.resize();
    window.addEventListener("resize", () => this.resize());
    if (window.visualViewport) window.visualViewport.addEventListener("resize", () => this.resize());
  },
  makeGlow() {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, "rgba(255,255,255,1)");
    rg.addColorStop(0.35, "rgba(255,255,255,.42)");
    rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
    this.glow = c;
  },
  /** One sprite, tinted by composite, keeps glows off the expensive shadowBlur path. */
  blob(x, y, r, colour, alpha) {
    const c = this.ctx;
    c.save(); c.globalAlpha = alpha; c.globalCompositeOperation = "lighter";
    c.drawImage(this.glow, x - r, y - r, r * 2, r * 2);
    if (colour) { c.globalAlpha = alpha * 0.8; c.fillStyle = colour; c.beginPath(); c.arc(x, y, r * 0.22, 0, 6.2832); c.fill(); }
    c.restore();
  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.W = this.cv.clientWidth; this.H = this.cv.clientHeight; this.dpr = dpr;
    this.cv.width = Math.max(1, Math.round(this.W * dpr));
    this.cv.height = Math.max(1, Math.round(this.H * dpr));
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.seedParticles();
  },
  seedParticles() {
    const want = this.reduced ? 40 : Math.round(clamp(this.W * this.H / 5200, 60, 220));
    this.particles = [];
    for (let i = 0; i < want; i++) {
      this.particles.push({
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        r: 0.5 + Math.random() * 1.9,
        sp: 0.08 + Math.random() * 0.5,
        ph: Math.random() * 6.2832,
        a: 0.15 + Math.random() * 0.5,
      });
    }
  },
  reset(seed, pb) {
    this.props = buildProps(seed);
    this.shipDepth = 0; this.targetDepth = 0; this.vel = 0; this.lead = 0;
    this.bubbles = []; this.rings = [];
    this.pb = pb; this.pbPassed = false;
    this.buoy = 0; this.deepFlash = 0; this.sonar = 0;
  },
  setReduced(v) { this.reduced = v; this.seedParticles(); },
  goTo(depth) { this.targetDepth = Math.max(0, depth); },
  ring(strong) { this.rings.push({ r: 0, max: strong ? Math.max(this.W, this.H) * 0.95 : 240, a: 1, strong: !!strong }); },
  puff(n, up) {
    if (this.reduced) n = Math.min(n, 6);
    for (let i = 0; i < n; i++) this.bubbles.push({
      x: this.shipX + (Math.random() - 0.5) * 60,
      y: this.shipY + 12 + Math.random() * 26,
      r: 1 + Math.random() * 3.6,
      sp: (up ? 1 : 1) * (0.5 + Math.random() * 1.5),
      ph: Math.random() * 6.2832, life: 1,
    });
  },

  step(dt) {
    this.t += dt;
    const k = this.reduced ? 0.22 : (Math.abs(this.targetDepth - this.shipDepth) > 140 ? 0.021 : 0.045);
    const prev = this.shipDepth;
    this.shipDepth += (this.targetDepth - this.shipDepth) * clamp(k * dt * 60, 0, 1);
    if (Math.abs(this.targetDepth - this.shipDepth) < 0.25) this.shipDepth = this.targetDepth;
    this.vel = (this.shipDepth - prev) / Math.max(dt, 0.0001);
    this.lead = lerp(this.lead, clamp(this.vel * 0.06, -34, 34), clamp(dt * 4, 0, 1));

    const anchor = 0.42;
    const worldY = this.shipDepth * CFG.pxPerMetre;
    this.camTop = Math.max(-this.H * 0.30, worldY - this.H * anchor + this.lead);
    this.shipY = worldY - this.camTop;
    this.shipX = this.W * 0.42;

    if (this.pb != null && !this.pbPassed && this.shipDepth > this.pb + 0.5) { this.pbPassed = true; this.onPB && this.onPB(); }

    for (const b of this.bubbles) { b.y -= b.sp * dt * 60 * 1.1; b.x += Math.sin(this.t * 2 + b.ph) * 0.35; b.life -= dt * 0.42; }
    this.bubbles = this.bubbles.filter(b => b.life > 0 && b.y > -20);
    for (const r of this.rings) { r.r += dt * (r.strong ? 620 : 300); r.a = Math.max(0, 1 - r.r / r.max); }
    this.rings = this.rings.filter(r => r.a > 0.01);
    if (this.deepFlash > 0) this.deepFlash = Math.max(0, this.deepFlash - dt * 0.55);
    if (this.sonar > 0) this.sonar = Math.max(0, this.sonar - dt);
    this.buoy = lerp(this.buoy, this.buoyTarget || 0, clamp(dt * 3.2, 0, 1));
    Audio_.setDepth(this.shipDepth);
  },

  depthAtY(sy) { return (this.camTop + sy) / CFG.pxPerMetre; },
  yAtDepth(d, f) { return d * CFG.pxPerMetre - this.camTop * (f == null ? 1 : f); },

  draw() {
    const c = this.ctx, W = this.W, H = this.H, t = this.t;
    const topD = this.depthAtY(0), botD = this.depthAtY(H);

    /* --- water column --------------------------------------------------- */
    const grad = c.createLinearGradient(0, 0, 0, H);
    for (let i = 0; i <= 8; i++) {
      const p = i / 8;
      grad.addColorStop(p, rgb(waterRGB(lerp(topD, botD, p))));
    }
    c.fillStyle = grad; c.fillRect(0, 0, W, H);

    /* --- sky, waves, gulls ---------------------------------------------- */
    const surfY = this.yAtDepth(0, 1);
    if (surfY > -40) this.drawSky(surfY);

    /* --- light shafts ---------------------------------------------------- */
    const shaftFade = clamp(1 - topD / 340, 0, 1);
    if (shaftFade > 0.02 && !this.reduced) {
      c.save(); c.globalCompositeOperation = "lighter";
      for (let i = 0; i < 6; i++) {
        const bx = ((i * 0.19 + Math.sin(t * 0.09 + i) * 0.03) % 1) * (W + 300) - 150;
        const w = 40 + i * 13;
        const g2 = c.createLinearGradient(0, surfY, 0, surfY + H * 1.2);
        g2.addColorStop(0, "rgba(150,245,235," + (0.11 * shaftFade) + ")");
        g2.addColorStop(1, "rgba(120,220,220,0)");
        c.fillStyle = g2;
        c.beginPath();
        c.moveTo(bx, surfY); c.lineTo(bx + w, surfY);
        c.lineTo(bx + w * 3.6 + 150, surfY + H * 1.2); c.lineTo(bx + w * 2.2 + 150, surfY + H * 1.2);
        c.closePath(); c.fill();
      }
      c.restore();
    }

    /* --- scenery --------------------------------------------------------- */
    for (const p of this.props) {
      const f = PARALLAX[p.type] || 1;
      const y = this.yAtDepth(p.depth, f);

    /* --- personal best ghost --------------------------------------------- */

    }
    c.restore();

    /* --- ship ------------------------------------------------------------ */
    this.drawShip(c, this.shipX, this.shipY, t);

    /* --- sonar rings ----------------------------------------------------- */
    for (const r of this.rings) {
      c.save();
      c.globalCompositeOperation = "lighter";
      c.strokeStyle = "rgba(84,232,210," + (r.a * (r.strong ? 0.5 : 0.34)) + ")";
      c.lineWidth = r.strong ? 2.5 : 1.3;

    /* --- depth ruler ----------------------------------------------------- */
    this.drawRuler(c, W, H, topD, botD);
  },

  drawSky(surfY) {
    const c = this.ctx, W = this.W;
    const g = c.createLinearGradient(0, Math.min(0, surfY - this.H * 0.4), 0, surfY);
    g.addColorStop(0, "#1b3550"); g.addColorStop(0.45, "#5d7f92"); g.addColorStop(0.82, "#c99a67"); g.addColorStop(1, "#e8b97f");
    c.fillStyle = g; c.fillRect(0, -this.H, W, surfY + this.H);
    // low sun
    const sx = W * 0.74, sy = surfY - this.H * 0.16;
    this.blob(sx, sy, 90, null, 0.34);
    c.fillStyle = "rgba(255,226,171,.85)"; c.beginPath(); c.arc(sx, sy, 15, 0, 6.2832); c.fill();
    // gulls
    c.strokeStyle = "rgba(20,36,48,.55)"; c.lineWidth = 1.4;
    for (const p of this.props) {
      if (p.type !== "gull") continue;
      const gy = this.yAtDepth(p.depth, PARALLAX.gull);
      if (gy > surfY - 10) continue;
      const gx = ((p.x + this.t * p.sp * 0.012) % 1.25 - 0.12) * W;
      const s = 5 + p.s * 5, fl = Math.sin(this.t * 3 + p.r * 6) * 0.35 + 1;
      c.beginPath();
      c.moveTo(gx - s, gy); c.quadraticCurveTo(gx - s * 0.5, gy - s * 0.55 * fl, gx, gy);
      c.quadraticCurveTo(gx + s * 0.5, gy - s * 0.55 * fl, gx + s, gy);
      c.stroke();
    }
    // surface chop
    c.save();
    c.strokeStyle = "rgba(226,246,255,.5)"; c.lineWidth = 1.6;
    c.beginPath();
    for (let x = -10; x <= W + 10; x += 6) {
      const y = surfY + Math.sin(x * 0.026 + this.t * 1.5) * 4 + Math.sin(x * 0.011 - this.t * 0.9) * 3;
      x === -10 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.stroke();
    c.fillStyle = "rgba(190,236,244,.20)";
    c.lineTo(W + 10, surfY + 26); c.lineTo(-10, surfY + 26); c.closePath(); c.fill();
    c.restore();
  },

  drawRuler(c, W, H, topD, botD) {
    const rw = W < 520 ? 44 : 66, x0 = W - rw;
    c.save();
    c.fillStyle = "rgba(1,8,15,.42)"; c.fillRect(x0, 0, rw, H);
    c.strokeStyle = "rgba(84,232,210,.18)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0 + .5, 0); c.lineTo(x0 + .5, H); c.stroke();
    const step = 10;
    const start = Math.floor(Math.max(0, topD) / step) * step;
    c.font = "500 9px " + MONO;
    for (let d = start; d < botD; d += step) {
      const y = this.yAtDepth(d, 1);
      if (y < -10 || y > H + 10) continue;
      const major = d % 50 === 0, hundred = d % 100 === 0;
      c.strokeStyle = hundred ? "rgba(243,163,60,.55)" : major ? "rgba(231,241,239,.30)" : "rgba(231,241,239,.13)";
      c.beginPath(); c.moveTo(x0 + 1, y + .5); c.lineTo(x0 + (hundred ? 15 : major ? 10 : 5), y + .5); c.stroke();
      if (hundred) { c.fillStyle = "rgba(243,163,60,.82)"; c.fillText(String(d), x0 + 19, y + 3); }
    }
    for (const z of ZONES) {
      const y = this.yAtDepth(z.from, 1);
      if (z.from === 0 || y < -10 || y > H + 10) continue;
      c.strokeStyle = "rgba(84,232,210,.45)";
      c.beginPath(); c.moveTo(x0 + 1, y + .5); c.lineTo(W, y + .5); c.stroke();
      c.save(); c.translate(x0 - 4, y - 5); c.rotate(-Math.PI / 2);
      c.textAlign = "right"; c.fillStyle = "rgba(84,232,210,.75)";
      c.font = "600 9px " + MONO;
      c.fillText(z.name.toUpperCase(), 0, 0);
      c.restore();
    }
    if (this.pb != null && this.pb > 0) {
      const y = this.yAtDepth(this.pb, 1);
      if (y > -10 && y < H + 10) {
        c.fillStyle = "rgba(84,232,210,.9)";
        c.beginPath(); c.moveTo(W - 3, y); c.lineTo(W - 12, y - 5); c.lineTo(W - 12, y + 5); c.closePath(); c.fill();

const MONO = '"IBM Plex Mono",ui-monospace,monospace';

Object.assign(World, {
  drawProp(p, x, y, t) {
    const c = this.ctx;
    const sway = this.reduced ? 0 : Math.sin(t * 0.6 + p.r * 6.28);
    switch (p.type) {
      case "gull": return;

      case "kelp": {
        c.save(); c.strokeStyle = "rgba(18,74,66,.85)"; c.lineCap = "round";
        for (let i = 0; i < 4; i++) {
          const ox = (i - 1.5) * 9 * p.s, h = p.h * p.s * (0.7 + (i % 2) * 0.4);
          c.lineWidth = 3.5 * p.s;
          c.beginPath(); c.moveTo(x + ox, y);
          c.bezierCurveTo(x + ox + sway * 16, y - h * 0.4, x + ox - sway * 14, y - h * 0.72, x + ox + sway * 9, y - h);
          c.stroke();
        }
        c.restore(); return;
      }
      case "rock": {
        c.save(); c.fillStyle = "rgba(8,36,44,.9)";
        c.beginPath();
        const r0 = 22 * p.s;
        for (let i = 0; i <= 7; i++) {
          const a = (i / 7) * Math.PI, rr = r0 * (0.65 + ((i * 37 + p.r * 100) % 40) / 100);
          const px = x - Math.cos(a) * rr, py = y - Math.sin(a) * rr * 0.55;
          i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
        }
        c.closePath(); c.fill(); c.restore(); return;
      }
      case "school": {
        c.save(); c.fillStyle = "rgba(122,186,190,.36)";
        for (let i = 0; i < p.n; i++) {
          const a = i * 2.399 + p.r * 6, rr = 10 + i * 4.2;
          const fx = x + Math.cos(a) * rr * 1.7 + Math.sin(t * 0.7 + i) * 5;
          const fy = y + Math.sin(a) * rr * 0.55;
          this.fish(c, fx, fy, 4.4 * p.s, 1);
        }
        c.restore(); return;
      }
      case "fish": {
        c.save(); c.fillStyle = "rgba(96,160,168,.5)";
        this.fish(c, x + sway * 18, y, 13 * p.s, 1); c.restore(); return;
      }
      case "wreck": {
        c.save(); c.translate(x, y); c.rotate((p.r - 0.5) * 0.55);
        const s = 1.1 * p.s;
        c.fillStyle = "rgba(6,28,38,.95)";
        c.beginPath();
        c.moveTo(-52 * s, -14 * s); c.lineTo(46 * s, -18 * s);
        c.quadraticCurveTo(62 * s, 0, 30 * s, 14 * s); c.lineTo(-40 * s, 12 * s);
        c.quadraticCurveTo(-58 * s, 2, -52 * s, -14 * s); c.closePath(); c.fill();
        c.strokeStyle = "rgba(84,232,210,.22)"; c.lineWidth = 1; c.stroke();
        c.fillRect(-6 * s, -34 * s, 4 * s, 22 * s);
        c.fillStyle = "rgba(84,232,210,.10)";
        for (let i = 0; i < 3; i++) c.fillRect((-30 + i * 22) * s, -8 * s, 7 * s, 7 * s);
        c.restore(); return;
      }
      case "jelly": {
        const pulse = this.reduced ? 1 : 1 + Math.sin(t * 1.3 + p.ph) * 0.13;
        const s = 13 * p.s * pulse;
        this.blob(x, y, s * 2.6, null, 0.16);
        c.save();
        c.strokeStyle = "rgba(168,214,255,.55)"; c.lineWidth = 1.4;
        c.fillStyle = "rgba(140,196,255,.16)";
        c.beginPath(); c.ellipse(x, y, s, s * 0.82, 0, Math.PI, 0); c.fill(); c.stroke();
        for (let i = 0; i < 5; i++) {
          const ox = x + (i - 2) * s * 0.34;
          c.beginPath(); c.moveTo(ox, y);
          c.quadraticCurveTo(ox + Math.sin(t * 1.7 + i + p.ph) * 8, y + s * 1.5, ox + Math.sin(t * 1.1 + i) * 5, y + s * 2.6);
          c.stroke();
        }
        c.restore(); return;
      }
      case "whale": {
        c.save();
        const s = 2.4 * p.s;
        const wx = ((p.x + t * p.sp * 0.004) % 1.4 - 0.2) * (this.W + 400) - 200;
        c.globalAlpha = 0.30; c.fillStyle = "#01131f";
        c.beginPath();
        c.moveTo(wx - 70 * s, y);
        c.quadraticCurveTo(wx - 10 * s, y - 26 * s, wx + 62 * s, y - 5 * s);
        c.lineTo(wx + 86 * s, y - 20 * s); c.lineTo(wx + 84 * s, y + 10 * s);
        c.lineTo(wx + 60 * s, y + 4 * s);
        c.quadraticCurveTo(wx - 10 * s, y + 20 * s, wx - 70 * s, y);
        c.closePath(); c.fill(); c.restore(); return;
      }
      case "biolum": {
        for (let i = 0; i < p.n; i++) {
          const a = i * 2.399 + p.r * 9, rr = 9 + i * 6.5;
          const bx = x + Math.cos(a) * rr * 1.5, by = y + Math.sin(a) * rr * 0.7;
          const pu = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.5 + i * 1.3 + p.ph));
          this.blob(bx, by, 9 + pu * 7, "#7ff5e6", 0.30 * pu);
        }
        return;
      }
      case "angler": {
        c.save();
        c.fillStyle = "rgba(1,10,18,.94)";
        c.beginPath();
        const s = 15 * p.s;
        c.moveTo(x - s * 1.5, y); c.quadraticCurveTo(x, y - s, x + s * 1.3, y);
        c.quadraticCurveTo(x, y + s, x - s * 1.5, y); c.closePath(); c.fill();
        c.strokeStyle = "rgba(1,10,18,.94)"; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(x - s * 0.2, y - s * 0.6);
        c.quadraticCurveTo(x + s * 0.9, y - s * 2.1, x + s * 1.5, y - s * 1.5); c.stroke();
        const pu = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.1 + p.ph));
        this.blob(x + s * 1.5, y - s * 1.5, 13 * pu, "#ffe2ab", 0.5 * pu);
        c.restore(); return;
      }
      case "spire": {
        c.save(); c.globalAlpha = 0.5; c.fillStyle = "#010c16";
        const w = 34 * p.s, h = 150 * p.s;
        c.beginPath(); c.moveTo(x - w, y + h); c.lineTo(x - w * 0.3, y); c.lineTo(x + w * 0.35, y + h * 0.2); c.lineTo(x + w, y + h);
        c.closePath(); c.fill(); c.restore(); return;
      }
      case "ruin": {
        c.save();
        const s = p.s;
        c.fillStyle = "rgba(4,18,28,.96)";
        c.strokeStyle = "rgba(84,232,210,.13)"; c.lineWidth = 1;
        if (p.kind === 0) {
          for (let i = 0; i < 3; i++) {
            const cx = x + (i - 1) * 34 * s, h = (60 + ((i * 53 + p.r * 90) % 45)) * s;
            c.fillRect(cx - 7 * s, y - h, 14 * s, h);
            c.strokeRect(cx - 7 * s, y - h, 14 * s, h);
            c.fillRect(cx - 11 * s, y - h - 6 * s, 22 * s, 6 * s);
          }
          c.fillRect(x - 58 * s, y, 116 * s, 8 * s);
        } else if (p.kind === 1) {
          c.beginPath();
          c.moveTo(x - 46 * s, y); c.lineTo(x - 46 * s, y - 40 * s);
          c.quadraticCurveTo(x, y - 96 * s, x + 46 * s, y - 40 * s);
          c.lineTo(x + 46 * s, y); c.lineTo(x + 30 * s, y); c.lineTo(x + 30 * s, y - 40 * s);
          c.quadraticCurveTo(x, y - 74 * s, x - 30 * s, y - 40 * s);
          c.lineTo(x - 30 * s, y); c.closePath(); c.fill(); c.stroke();
        } else {
          c.save(); c.translate(x, y); c.rotate((p.r - 0.5) * 0.7);
          c.fillRect(-52 * s, -9 * s, 104 * s, 13 * s);
          c.strokeRect(-52 * s, -9 * s, 104 * s, 13 * s);
          c.restore();
        }
        c.restore(); return;
      }
      case "statue": {
        c.save(); c.globalAlpha = 0.85; c.fillStyle = "rgba(3,15,24,.97)";
        const s = 1.5 * p.s;
        c.beginPath(); c.arc(x, y - 66 * s, 17 * s, 0, 6.2832); c.fill();
        c.beginPath();
        c.moveTo(x - 26 * s, y); c.quadraticCurveTo(x - 17 * s, y - 52 * s, x, y - 50 * s);
        c.quadraticCurveTo(x + 17 * s, y - 52 * s, x + 26 * s, y); c.closePath(); c.fill();
        c.globalAlpha = 1;
        this.blob(x - 6 * s, y - 68 * s, 7, "#7ff5e6", 0.5);
        this.blob(x + 6 * s, y - 68 * s, 7, "#7ff5e6", 0.5);
        c.restore(); return;
      }
      case "seabed": {
        c.save(); c.fillStyle = "#01070d";
        c.beginPath(); c.moveTo(0, y + 40);
        for (let sx = 0; sx <= this.W; sx += 26)
          c.lineTo(sx, y + Math.sin(sx * 0.013) * 13 + Math.sin(sx * 0.031 + 2) * 7);
        c.lineTo(this.W, y + 400); c.lineTo(0, y + 400); c.closePath(); c.fill();
        c.restore(); return;
      }
    }
  },

  fish(c, x, y, s, dir) {
    c.beginPath();
    c.moveTo(x - s * dir, y);
    c.quadraticCurveTo(x, y - s * 0.52, x + s * dir, y);
    c.quadraticCurveTo(x, y + s * 0.52, x - s * dir, y);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(x - s * dir, y); c.lineTo(x - s * 1.6 * dir, y - s * 0.42);
    c.lineTo(x - s * 1.6 * dir, y + s * 0.42); c.closePath(); c.fill();
  },

  /** R/V DEEP CUT. Warm cabin light, weathered hull, working A-frame at the
   *  stern: the silhouette has to stay readable at every depth.            */
  drawShip(c, x, y, t) {
    const d = this.shipDepth;
    const bob = this.reduced ? 0 : Math.sin(t * 1.25) * (d < 30 ? 3.4 : 1.2);
    const roll = this.reduced ? 0 : Math.sin(t * 0.85) * (d < 30 ? 0.035 : 0.014);
    const sink = clamp(d / 60, 0, 1);

    // downward work light, earns its keep as the water darkens
    const lamp = clamp((d - 40) / 260, 0, 1);
    if (lamp > 0.02) {
      c.save(); c.globalCompositeOperation = "lighter";
      const g = c.createLinearGradient(x, y + 6, x + 40, y + 420);
      g.addColorStop(0, "rgba(255,216,150," + (0.20 * lamp) + ")");
      g.addColorStop(1, "rgba(255,216,150,0)");
      c.fillStyle = g;
      c.beginPath(); c.moveTo(x - 9, y + 10); c.lineTo(x + 13, y + 10);
      c.lineTo(x + 150, y + 430); c.lineTo(x - 78, y + 430); c.closePath(); c.fill();
      c.restore();
    }

    c.save();
    c.translate(x, y + bob); c.rotate(roll);

    // buoy on a line: the physical reason the ship rises
    if (this.buoy > 0.02) {
      const br = 13 * this.buoy;
      c.strokeStyle = "rgba(231,241,239,.4)"; c.lineWidth = 1;
      c.beginPath(); c.moveTo(-6, -14); c.lineTo(-20, -52 - br); c.stroke();
      c.fillStyle = "#f3a33c";
      c.beginPath(); c.arc(-20, -58 - br, br, 0, 6.2832); c.fill();
      c.fillStyle = "rgba(255,255,255,.55)";
      c.fillRect(-20 - br, -60 - br, br * 2, 2.5);
    }

    // hull
    c.fillStyle = "#231d17";
    c.beginPath();
    c.moveTo(-40, -9); c.lineTo(38, -9);
    c.quadraticCurveTo(46, -8, 42, 2);
    c.lineTo(34, 13); c.quadraticCurveTo(0, 18, -30, 13);
    c.quadraticCurveTo(-42, 8, -40, -9); c.closePath(); c.fill();
    // weathered boot-topping
    c.fillStyle = "#8c4433";
    c.beginPath(); c.moveTo(-38, 5); c.lineTo(40, 3); c.lineTo(35, 12);
    c.quadraticCurveTo(0, 17, -30, 12); c.closePath(); c.fill();
    // deck line + rivets
    c.fillStyle = "#3b3128"; c.fillRect(-40, -11, 80, 3);
    c.fillStyle = "rgba(231,241,239,.16)";
    for (let i = 0; i < 9; i++) c.fillRect(-34 + i * 8, -4, 1.4, 1.4);

    // cabin with the warm window
    c.fillStyle = "#2f2a22"; c.fillRect(-16, -30, 30, 20);
    c.fillStyle = "#3d352a"; c.fillRect(-16, -32, 30, 3);
    this.blob(0, -22, 30, null, 0.30);
    c.fillStyle = "#ffcb73"; c.fillRect(-11, -26, 9, 8);
    c.fillStyle = "#ffe2ab"; c.fillRect(2, -26, 8, 8);
    // porthole
    c.strokeStyle = "#5a4c3a"; c.lineWidth = 1.5;
    c.beginPath(); c.arc(-26, -3, 4, 0, 6.2832); c.stroke();
    c.fillStyle = "rgba(255,203,115,.75)"; c.beginPath(); c.arc(-26, -3, 2.6, 0, 6.2832); c.fill();

    // mast, radar, A-frame crane at the stern
    c.strokeStyle = "#4a4136"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-6, -32); c.lineTo(-6, -52); c.stroke();
    c.lineWidth = 1.4;
    c.beginPath(); c.arc(-6, -54, 5, Math.PI, 0); c.stroke();
    c.beginPath(); c.moveTo(22, -10); c.lineTo(30, -34); c.lineTo(38, -10); c.stroke();
    c.beginPath(); c.moveTo(30, -34); c.lineTo(30, -20); c.stroke();
    c.fillStyle = "#4a4136"; c.beginPath(); c.arc(30, -18, 2.4, 0, 6.2832); c.fill();
    // sonar dome
    c.fillStyle = "#1a1610";
    c.beginPath(); c.ellipse(-4, 14, 9, 5, 0, 0, Math.PI); c.fill();
    if (sink > 0.2) this.blob(-4, 17, 11, "#54e8d2", 0.22 + 0.2 * Math.sin(t * 2.4));

    // name plate
    c.fillStyle = "rgba(231,241,239,.34)";
    c.font = "600 4.4px " + MONO;
    c.fillText("R/V DEEP CUT", -33, 0);

    c.restore();
  },
});

/* ---------------------------------- UI ------------------------------------
   Static chrome is written once with innerHTML. Anything a player typed, or

 "rv-missed","btn-continue","timer-label","timer-n","timerbar","timerfill","anchor-btn","anchor-text","answer-form",

 "dataset-file","dataset-paste","practice-flag","vignette"
].forEach(k => el[k.replace(/-([a-z])/g, (m, c) => c.toUpperCase())] = $(k));

const SCREENS = ["screenTitle","screenTutorial","screenPlay","screenResults","screenChart","screenSettings"];
let screenBefore = "screenTitle";
function show(name, remember) {

  SCREENS.forEach(s => { el[s].hidden = s !== name; });
  if (name !== "screenPlay") document.body.classList.remove("kb-open");
}

const FLAVOUR = {
  deep:  ["You found a thought nobody packed.", "Uncharted thinking.", "The chart ends here.", "Nobody else went looking there."],
  good:  ["That answer has some weight.", "Ballast secured.", "The crowd walked straight past that one."],
  small: ["A little ballast.", "Marginally overlooked.", "Slightly off the beaten track."],
  flat:  ["Dead level. The sea is undecided."],
  upS:   ["The crowd was nearby.", "A common thought, that one."],
  upB:   ["Too obvious. Buoyancy increased.", "The crowd stayed near the surface.", "Half the fleet said the same thing."],
  pen:   ["Nothing to weigh. The ship lightens.", "The instruments found nothing to measure."],
};
function flavourFor(change, kind) {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  if (kind !== MATCH.HIT) return pick(FLAVOUR.pen);
  if (change >= CFG.deepCutThreshold) return pick(FLAVOUR.deep);
  if (change >= 40) return pick(FLAVOUR.good);
  if (change > 0) return pick(FLAVOUR.small);
  if (change === 0) return pick(FLAVOUR.flat);
  if (change > -40) return pick(FLAVOUR.upS);
  return pick(FLAVOUR.upB);
}
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n));

/* --------------------------------- GAME -----------------------------------
   One state machine, one clock. Every transition is decided by comparing
   `now` against a timestamp recorded on entry - there is not a single
   setTimeout in the round loop, so restarting cannot leave a timer alive.  */

const ST = { IDLE: "idle", ASK: "ask", SONAR: "sonar", REVEAL: "reveal", DONE: "done" };

const G = {
  state: ST.IDLE, stateAt: 0, mode: "timed",
  dataset: null, queue: [], round: 0, depth: 0, maxDepth: 0,
  log: [], anchorArmed: false, anchorUsed: false,
  deadline: 0, continueAt: 0, locked: false, pending: null, bucket: "", pb: null,
  hiddenAt: 0, pausedLeft: null,
};

function activeDataset() { return Store.loadDataset() || DEMO_DATA; }

function pickQuestions(ds, n) {
  const byCat = new Map();
  for (const q of ds.compiled) {
    if (!byCat.has(q.category)) byCat.set(q.category, []);
    byCat.get(q.category).push(q);
  }
  for (const list of byCat.values()) list.sort(() => Math.random() - 0.5);
  const cats = Array.from(byCat.keys()).sort(() => Math.random() - 0.5);
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 500) {
    let added = false;
    for (const c of cats) {
      const list = byCat.get(c);
      if (list.length) { out.push(list.pop()); added = true; }
      if (out.length >= n) break;
    }
    if (!added) break;
  }
  return out.slice(0, n);
}

function startRun(mode) {
  Audio_.unlock();
  const ds = prepareDataset(activeDataset());   // frozen for the whole run
  G.dataset = ds;
  G.mode = mode;
  G.queue = pickQuestions(ds, CFG.rounds);
  G.round = 0; G.depth = 0; G.maxDepth = 0; G.log = [];
  G.anchorArmed = false; G.anchorUsed = false;
  G.locked = false; G.pending = null;
  G.deadline = 0; G.continueAt = 0; G.hiddenAt = 0; G.pausedLeft = null;
  G.bucket = Store.bucket(mode, ds.datasetVersion);
  G.pb = Store.best(G.bucket);

  document.body.classList.toggle("practice", mode === "practice");
  el.practiceFlag.hidden = mode !== "practice";
  el.timerLabel.textContent = mode === "practice" ? "Untimed" : "Time";

  World.reset(Math.floor(Math.random() * 1e9), G.pb);
  World.onPB = () => {
    World.ring(false);
    el.vignette.classList.add("deep");
    setTimeout(() => el.vignette.classList.remove("deep"), 700);
    Audio_.best();
  };
  paintBadges();
  buildPips();
  show("screenPlay");
  nextRound();
}

function buildPips() {
  el.pips.textContent = "";
  for (let i = 0; i < CFG.rounds; i++) {
    const s = document.createElement("span");
    s.className = "pip";
    el.pips.appendChild(s);
  }
}
function paintPips() {
  const kids = el.pips.children;
  for (let i = 0; i < kids.length; i++) {
    const r = G.log[i];
    kids[i].className = "pip" + (r ? (r.change > 0 ? " down" : r.change < 0 ? " up" : "") : (i === G.round ? " now" : ""));
  }
}

function paintDepth() {
  el.depthN.textContent = fmt(G.depth);
  el.zoneN.textContent = zoneAt(G.depth).name;
}

function paintBadges() {
  const ds = G.dataset || prepareDataset(activeDataset());
  const demo = ds.sourceType === "simulated-demo";
  const text = demo ? "Demo frequencies — simulated"
                    : "Survey data — " + (ds.sourceRef || ds.sourceType);
  [["badgeTitleText", "badgeTitle"], ["badgePlayText", "badgePlay"], ["badgeResText", "badgeRes"]].forEach(([t, b]) => {
    el[t].textContent = demo ? (b === "badgeTitle" ? text : "Demo — simulated") : text;
    el[b].classList.toggle("survey", !demo);
  });
}

function nextRound() {
  if (G.round >= CFG.rounds) return finish();
  const q = G.queue[G.round];
  if (!q) return finish();

  G.state = ST.ASK; G.stateAt = performance.now();
  G.locked = false; G.pending = null;
  G.deadline = G.mode === "practice" ? 0 : performance.now() + CFG.roundSeconds * 1000;

  el.roundN.textContent = String(G.round + 1);
  el.qCat.textContent = q.category;
  el.qPrompt.textContent = q.prompt;
  el.promptBlock.hidden = false;
  el.sonarBlock.hidden = true;
  el.revealBlock.hidden = true;
  el.console.hidden = false;
  el.answer.value = "";
  el.answer.disabled = false;
  el.submit.disabled = false;
  el.hint.textContent = "One word or a short phrase. Rarer is deeper.";
  el.timerbar.classList.remove("warn", "crit");
  el.timerfill.style.transform = "scaleX(1)";
  el.timerN.textContent = G.mode === "practice" ? "∞" : CFG.roundSeconds + "s";
  paintAnchorButton();
  paintPips();

function paintAnchorButton() {
  const b = el.anchorBtn;

  el.anchorText.textContent = G.anchorUsed
    ? "Anchor spent"
    : G.anchorArmed
      ? "Anchor armed — this round counts double, up or down"
      : "Drop the anchor — doubles this round, once per dive";

function toggleAnchor() {
  if (G.state !== ST.ASK || G.anchorUsed) return;
  G.anchorArmed = !G.anchorArmed;
  Audio_.ui();

    ? "Risk doubled both ways: a popular answer now costs twice the buoyancy."
    : "One word or a short phrase. Rarer is deeper.";

function submitAnswer(raw, timedOut) {
  if (G.state !== ST.ASK || G.locked) return;
  const text = String(raw || "").slice(0, CFG.maxAnswerChars).trim();
  if (!timedOut && !text) {
    el.answer.classList.remove("shake"); void el.answer.offsetWidth; el.answer.classList.add("shake");
    return;
  }
  G.locked = true;
  Audio_.unlock();

  const q = G.queue[G.round];
  const res = timedOut ? { kind: MATCH.TIMEOUT, key: "" } : resolveAnswer(q, text, Store.data.settings.typo);

  let change, percent = null;
  if (res.kind === MATCH.HIT) { percent = res.answer.percent; change = SCORING.fromPercent(percent); }
  else change = SCORING.unsupportedPenalty;

  const anchored = G.anchorArmed;
  if (anchored) { change = SCORING.applyAnchor(change); G.anchorUsed = true; G.anchorArmed = false; }

  G.pending = { q, res, text, change, percent, anchored, timedOut: !!timedOut };

  el.answer.disabled = true; el.submit.disabled = true;
  el.promptBlock.hidden = true;
  el.sonarBlock.hidden = false;
  el.sonarSub.textContent = anchored ? "Anchor away — doubling this reading" : "Measuring against the dataset";
  el.console.hidden = true;
  document.body.classList.remove("kb-open");
  el.answer.blur();

  G.state = ST.SONAR; G.stateAt = performance.now();
  World.ring(false);
  Audio_.ping();
}

function revealRound() {
  const p = G.pending;
  const q = p.q, res = p.res;
  const before = G.depth;
  G.depth = Math.max(0, G.depth + p.change);
  G.maxDepth = Math.max(G.maxDepth, G.depth);
  const applied = G.depth - before;
  const deep = res.kind === MATCH.HIT && p.change >= CFG.deepCutThreshold;

  G.log.push({
    n: G.round + 1, prompt: q.prompt, answer: p.text, kind: res.kind,
    canonical: res.kind === MATCH.HIT ? res.answer.canonical : null,
    percent: p.percent, change: p.change, applied, depth: G.depth,
    anchored: p.anchored, why: res.why || null, corrected: res.corrected || null,
    sampleSize: q.sampleSize,
  });

  el.sonarBlock.hidden = true;
  el.revealBlock.hidden = false;

  el.rvAnswer.textContent = p.timedOut ? "No answer" : p.text;
  el.rvAnswer.className = "reveal-answer " + (res.kind === MATCH.HIT ? "hit" : "miss");
  el.rvCorrected.textContent = res.corrected ? "matched to “" + res.corrected + "”" : "";

  const demo = G.dataset.sourceType === "simulated-demo";
  if (res.kind === MATCH.HIT) {
    el.rvFreq.hidden = false;
    const pct = p.percent;
    el.rvBar.style.width = clamp(pct, 0.6, 100) + "%";
    el.rvBar.style.background = pct >= 25 ? "var(--amber)" : pct >= 12 ? "#c8b06a" : "var(--turq)";
    el.rvMid.style.left = "25%";

    el.rvFreqText.appendChild(strong);

  }

  el.rvChange.textContent = signed(p.change) + " m";
  el.rvChange.className = "change-num num " + (p.change > 0 ? "down" : p.change < 0 ? "up" : "");
  el.rvDir.className = "change-dir " + (p.change > 0 ? "down" : "up");
  el.rvDir.textContent = p.change > 0 ? "↓ Descending" : p.change < 0 ? "↑ Rising" : "Holding";
  el.rvStamp.hidden = !deep;

  let flav = flavourFor(p.change, res.kind);
  if (res.kind === MATCH.TIMEOUT) flav = "The clock ran out. Ballast released.";
  else if (res.kind === MATCH.INVALID) flav = res.why;
  else if (res.kind === MATCH.UNMEASURED) flav = "A fair answer — but this dataset recorded no responses for it at all, so there is nothing to weigh. Unmeasured is not the same as rare.";
  else if (res.kind === MATCH.UNLISTED) flav = "Not in this dataset’s answer bank — we cannot measure it, so it earns no ballast. That is not the same as being wrong.";
  el.rvFlavour.textContent = flav + (p.anchored ? "  The anchor doubled it." : "");

  el.rvMissed.textContent = "";
  if (q.deepest && (res.kind !== MATCH.HIT || res.answer.i !== q.deepest.i)) {
    const d = q.deepest;
    el.rvMissed.appendChild(document.createTextNode("Deepest available: "));
    const b = document.createElement("b"); b.textContent = d.canonical;
    el.rvMissed.appendChild(b);
