    World.puff(34, false);
    el.vignette.classList.add("deep");
    setTimeout(() => el.vignette.classList.remove("deep"), 1400);
    Audio_.deepCut();
  } else if (res.kind !== MATCH.HIT) {
    el.vignette.classList.add("rise");
    setTimeout(() => el.vignette.classList.remove("rise"), 900);
    Audio_.penalty();
  } else if (p.change > 0) {
    World.puff(10 + Math.round(p.change / 8), false);
    Audio_.descend(p.change);
  } else {
    el.vignette.classList.add("rise");
    setTimeout(() => el.vignette.classList.remove("rise"), 900);
    Audio_.rise();
  }

  paintDepth(); paintPips(); paintAnchorButton();
  el.btnContinue.disabled = true;
  el.btnContinue.textContent = G.round + 1 >= CFG.rounds ? "Surface" : "Continue";
  G.continueAt = performance.now() + (deep ? CFG.continueDelayDeepMs : CFG.continueDelayMs);
  G.state = ST.REVEAL; G.stateAt = performance.now();
}

function continueRound() {
  if (G.state !== ST.REVEAL || el.btnContinue.disabled) return;
  Audio_.ui();
  G.round++;
  if (G.round >= CFG.rounds) finish(); else nextRound();
}

function finish() {
  G.state = ST.DONE;
  el.console.hidden = true;
  el.revealBlock.hidden = true;
  el.promptBlock.hidden = true;

  const run = {
    depth: G.depth, max: G.maxDepth, mode: G.mode,
    when: new Date().toISOString(),
    dataset: G.dataset.datasetVersion, scoring: SCORING.id,
    log: G.log.map(r => ({ n: r.n, a: r.answer, c: r.change, d: r.depth })),
  };
  const idx = Store.addRun(G.bucket, run);
  const isBest = idx === 0 && G.depth > 0;

  el.resCrown.hidden = !isBest;
  el.resDepth.textContent = fmt(G.depth);
  el.resZone.textContent = "Reached " + zoneAt(G.maxDepth).name + (G.mode === "practice" ? " · practice dive" : "");
  el.resMax.textContent = fmt(G.maxDepth) + " m";

  const hits = G.log.filter(r => r.kind === MATCH.HIT);
  const best = hits.slice().sort((a, b) => b.change - a.change)[0];
  const worst = G.log.slice().sort((a, b) => a.change - b.change)[0];
  el.resBestA.textContent = best && best.change > 0 ? best.answer : "—";
  el.resBestD.textContent = best && best.change > 0
    ? signed(best.change) + " m · " + (best.percent < 1 ? best.percent.toFixed(1) : Math.round(best.percent)) + "%" : "";
  el.resWorstA.textContent = worst ? (worst.timedOut || worst.kind === MATCH.TIMEOUT ? "No answer" : worst.answer) : "—";
  el.resWorstD.textContent = worst ? signed(worst.change) + " m" : "";

  const all = Store.runsIn(G.bucket);
  el.resRank.textContent = all.length > 1 ? "Rank " + (idx + 1) + " of " + all.length + " on this device" : "First recorded dive";

  el.resRows.textContent = "";
  for (const r of G.log) {
    const tr = document.createElement("tr");
    if (r.anchored) tr.className = "anchored";
    const cells = [
      ["", String(r.n)],
      ["", r.prompt.replace(/\s+—.*$/, "")],
      ["a", r.kind === MATCH.TIMEOUT ? "— no answer" : r.answer],
      ["n", r.percent == null ? "—" : (r.percent < 1 ? r.percent.toFixed(1) : Math.round(r.percent)) + "%"],
      ["n", signed(r.change) + (r.anchored ? " ⚓" : "")],
      ["n", fmt(r.depth) + " m"],
    ];
    cells.forEach(([cls, txt], i) => {
      const td = document.createElement("td");
      if (cls) td.className = cls;
      td.textContent = txt;
      if (i === 4) td.style.color = r.change > 0 ? "var(--turq)" : r.change < 0 ? "var(--amber)" : "var(--mute)";
      tr.appendChild(td);
    });
    el.resRows.appendChild(tr);
  }

  const demo = G.dataset.sourceType === "simulated-demo";
  el.resNote.textContent = demo
    ? "Percentages are simulated demo frequencies from dataset " + G.dataset.datasetVersion +
      ", authored for play balance. They are not survey results and do not describe what any real group of people said."
    : "Percentages from " + (G.dataset.sourceRef || "the imported dataset") + " · " + G.dataset.datasetVersion + ".";

  paintBadges();
  if (isBest) Audio_.best();
  show("screenResults");
  window.scrollTo(0, 0);
}

/* --------------------------------- CHART ---------------------------------- */
let chartMode = "timed";
function paintChart() {
  const ds = Store.loadDataset() || DEMO_DATA;
  const key = Store.bucket(chartMode, ds.datasetVersion);
  const runs = Store.runsIn(key);
  el.tabTimed.setAttribute("aria-selected", String(chartMode === "timed"));
  el.tabPractice.setAttribute("aria-selected", String(chartMode === "practice"));

  Array.from(el.chart.querySelectorAll(".mark")).forEach(n => n.remove());
  el.chartEmpty.hidden = runs.length > 0;
  el.chartEmpty.textContent = chartMode === "timed"
    ? "No timed dives recorded on this device yet."
    : "No practice dives recorded on this device yet.";

  const deepest = runs.length ? runs[0].depth : 0;
  const scale = Math.max(200, Math.ceil((deepest * 1.12) / 100) * 100);

  el.chartGrid.textContent = "";
  const stepGrid = scale <= 400 ? 100 : scale <= 900 ? 200 : 300;
  for (let d = 0; d <= scale; d += stepGrid) {
    const y = (d / scale) * 100;
    const line = document.createElement("i"); line.style.top = y + "%";
    const lab = document.createElement("span"); lab.style.top = y + "%"; lab.textContent = d + " m";
    el.chartGrid.appendChild(line); el.chartGrid.appendChild(lab);
  }

  runs.forEach((r, i) => {
    const m = document.createElement("div");
    m.className = "mark" + (i === 0 ? " best" : "");
    m.style.top = clamp((r.depth / scale) * 100, 1.5, 98.5) + "%";
    const dot = document.createElement("span"); dot.className = "dot";
    const line = document.createElement("span"); line.className = "line";
    const txt = document.createElement("span"); txt.className = "txt";
    txt.textContent = (i === 0 ? "Deepest dive · " : "") + fmt(r.depth) + " m";
    const em = document.createElement("em");
    let when = "";
    try { when = new Date(r.when).toLocaleDateString("en-AU", { day: "numeric", month: "short" }); } catch (e) {}
    em.textContent = when;
    txt.appendChild(em);
    m.appendChild(dot); m.appendChild(line); m.appendChild(txt);
    el.chart.appendChild(m);
  });

  el.chartFoot.textContent = "Bucket: " + chartMode + " · dataset " + ds.datasetVersion +
    " · scoring " + SCORING.id + " · " + runs.length + " run" + (runs.length === 1 ? "" : "s") +
    " kept, deepest " + CFG.maxRuns + " retained.";
}

/* -------------------------------- SETTINGS -------------------------------- */
const SCHEMA_TEXT = `{
  "datasetVersion": "my-survey-2026.1",
  "sourceType":     "human-survey",      // or "simulated-demo"
  "sourceRef":      "Where these numbers came from",
  "methodology":    "How they were collected",
  "collectionDate": "2026-03-14",
  "questions": [{
    "id":         "fruit-basic",
    "prompt":     "Name a fruit.",
    "category":   "food",
    "sampleSize": 1200,                  // total respondents asked
    "answers": [
      { "canonical": "apple",
        "aliases":   ["apples", "green apple"],
        "count":     480 },              // NOT a percentage
      { "canonical": "dragon fruit",
        "aliases":   ["dragonfruit", "pitaya"],
        "count":     24 }
    ],
    "knownInvalid": [
      { "term": "carrot", "why": "A carrot is a root vegetable." }
    ]
  }]
}`;

function setToggle(node, on) { node.setAttribute("aria-checked", String(!!on)); }
function applySettings() {
  const s = Store.data.settings;
  setToggle(el.tgSound, s.sound); setToggle(el.tgMotion, s.motion); setToggle(el.tgTypo, s.typo);
  Audio_.setEnabled(s.sound);
  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const reduced = !s.motion || prefersReduced;
  document.body.classList.toggle("reduced", reduced);
  World.setReduced(reduced);
}
function msg(node, text, bad) {
  node.textContent = "";
  const d = document.createElement("div");
  d.className = "notice" + (bad ? " bad" : "");
  d.textContent = text;
  node.appendChild(d);
}
function paintDataStatus() {
  const custom = Store.loadDataset();
  const ds = custom || DEMO_DATA;
  const bits = ["In use: " + ds.datasetVersion,
                "source type: " + ds.sourceType,
                ds.questions.length + " questions"];
  if (ds.sourceRef) bits.push("source: " + ds.sourceRef);
  if (ds.collectionDate) bits.push("collected: " + ds.collectionDate);
  if (ds.methodology) bits.push("method: " + ds.methodology);
  el.dataStatus.textContent = bits.join(" · ") + (custom ? " — imported, replacing the demo set." : " — the bundled demo set.");
}
function tryLoadDataset(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { return msg(el.dataMsg, "That is not valid JSON: " + e.message, true); }
  const v = validateDataset(parsed);
  if (!v.ok) return msg(el.dataMsg, "Rejected. " + v.errors.join(" "), true);
  Store.saveDataset(parsed);
  paintDataStatus(); paintBadges(); paintChart();
  msg(el.dataMsg, "Loaded " + parsed.questions.length + " questions from " + parsed.datasetVersion +
    ". It applies from your next dive, never mid-run, and its records are kept in a separate bucket.");
}

/* --------------------------------- INPUT ---------------------------------- */
el.answerForm.addEventListener("submit", e => { e.preventDefault(); submitAnswer(el.answer.value, false); });
el.answer.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submitAnswer(el.answer.value, false); } });
el.answer.addEventListener("focus", () => { if (G.state === ST.ASK) document.body.classList.add("kb-open"); });
el.answer.addEventListener("blur", () => setTimeout(() => document.body.classList.remove("kb-open"), 120));
el.anchorBtn.addEventListener("click", toggleAnchor);
el.btnContinue.addEventListener("click", continueRound);

$("btn-start").addEventListener("click", () => { Audio_.unlock(); buildTutorial(); show("screenTutorial"); });
$("btn-begin").addEventListener("click", () => startRun("timed"));
$("btn-back-title").addEventListener("click", () => show("screenTitle"));
$("btn-practice").addEventListener("click", () => { Audio_.unlock(); startRun("practice"); });
$("btn-again").addEventListener("click", () => startRun(G.mode));
$("btn-home").addEventListener("click", () => { show("screenTitle"); paintTitle(); });
$("btn-chart-1").addEventListener("click", () => { paintChart(); show("screenChart", true); });
$("btn-chart-2").addEventListener("click", () => { paintChart(); show("screenChart", true); });
$("btn-chart-back").addEventListener("click", () => show(screenBefore === "screenChart" ? "screenTitle" : screenBefore));
$("btn-settings-1").addEventListener("click", () => { paintDataStatus(); show("screenSettings", true); });
$("btn-set-back").addEventListener("click", () => show(screenBefore === "screenSettings" ? "screenTitle" : screenBefore));
el.tabTimed.addEventListener("click", () => { chartMode = "timed"; paintChart(); });
el.tabPractice.addEventListener("click", () => { chartMode = "practice"; paintChart(); });

[["tgSound", "sound"], ["tgMotion", "motion"], ["tgTypo", "typo"]].forEach(([k, key]) => {
  el[k].addEventListener("click", () => {
    Store.data.settings[key] = !Store.data.settings[key];
    Store.save(); applySettings();
    if (key === "sound" && Store.data.settings.sound) { Audio_.unlock(); Audio_.ui(); }
  });
});
$("btn-paste-load").addEventListener("click", () => tryLoadDataset(el.datasetPaste.value));
el.datasetFile.addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => tryLoadDataset(String(r.result));
  r.onerror = () => msg(el.dataMsg, "Could not read that file.", true);
  r.readAsText(f);
  e.target.value = "";
});
$("btn-restore-demo").addEventListener("click", () => {
  Store.clearDataset(); paintDataStatus(); paintBadges(); paintChart();
  msg(el.dataMsg, "Back to the bundled demo set. It applies from your next dive.");
});
$("btn-wipe").addEventListener("click", () => {
  Store.data.runs = {}; Store.save(); paintChart(); paintTitle();
  msg(el.dataMsg, "Local dive records erased. Settings and dataset kept.");
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && G.state === ST.REVEAL && !el.btnContinue.disabled) { e.preventDefault(); continueRound(); }
});

/* Mobile keyboard: keep the console above it without breaking the fixed HUD. */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const sync = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", kb + "px");
    document.body.classList.toggle("kb-open", kb > 90 && G.state === ST.ASK);
  };
  vv.addEventListener("resize", sync);
  vv.addEventListener("scroll", sync);
}

/* ---------------------------------- LOOP ---------------------------------- */
let last = performance.now();

/* State advancement is deliberately separate from painting: the machine is
   decided entirely by comparing `now` to recorded timestamps, so it can be
   stepped without a frame ever being drawn. */
function update(now) {
  if (G.state === ST.ASK && G.deadline) {
    const left = Math.max(0, G.deadline - now);
    const secs = Math.ceil(left / 1000);
    if (el.timerN.textContent !== secs + "s") {
      el.timerN.textContent = secs + "s";
      if (secs <= 5 && secs > 0) Audio_.tick();
    }
    el.timerfill.style.transform = "scaleX(" + (left / (CFG.roundSeconds * 1000)) + ")";
    el.timerbar.classList.toggle("warn", left <= 8000 && left > 3500);
    el.timerbar.classList.toggle("crit", left <= 3500);
    if (left <= 0) submitAnswer("", true);
  } else if (G.state === ST.SONAR) {
    const wait = document.body.classList.contains("reduced") ? CFG.sonarMsReduced : CFG.sonarMs;
    if (now - G.stateAt >= wait) revealRound();
  } else if (G.state === ST.REVEAL) {
    if (el.btnContinue.disabled && now >= G.continueAt) el.btnContinue.disabled = false;
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(now);
  World.step(dt);
  World.draw();
  requestAnimationFrame(frame);
}

/* The frame loop stops while the tab is hidden, but wall-clock time does not.
   Without this, backgrounding the tab mid-round would burn the whole 20 s and
   time you out the instant you came back. Every pending deadline is shifted by
   however long we were away, so leaving and returning costs nothing. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    G.hiddenAt = performance.now();
    if (G.state === ST.ASK && G.deadline) G.pausedLeft = Math.max(0, G.deadline - G.hiddenAt);
  } else {
    const now = performance.now();
    if (G.hiddenAt) {
      const gap = now - G.hiddenAt;
      G.stateAt += gap;
      if (G.continueAt) G.continueAt += gap;
      G.hiddenAt = 0;
    }
    if (G.state === ST.ASK && G.pausedLeft != null) { G.deadline = now + G.pausedLeft; G.pausedLeft = null; }
    last = now;
  }
});

/* ---------------------------------- BOOT ---------------------------------- */
function buildTutorial() {
  const rows = [["Apple", 40], ["Banana", 20], ["Dragon fruit", 2]];
  el.tutTable.textContent = "";
  for (const [name, p] of rows) {
    const ch = SCORING.fromPercent(p);
    const row = document.createElement("div"); row.className = "tut-row";
    const a = document.createElement("span"); a.className = "ans"; a.textContent = name;
    const pc = document.createElement("span"); pc.className = "pct"; pc.textContent = p + "% gave it";
    const c = document.createElement("span");
    c.className = "chg " + (ch > 0 ? "down" : "up");
    c.textContent = signed(ch) + " m " + (ch > 0 ? "↓" : "↑");
    row.appendChild(a); row.appendChild(pc); row.appendChild(c);
    el.tutTable.appendChild(row);
  }
}
function paintTitle() {
  const ds = Store.loadDataset() || DEMO_DATA;
  const t = Store.best(Store.bucket("timed", ds.datasetVersion));
  el.titleBest.textContent = t != null
    ? "Your deepest dive on this device: " + fmt(t) + " m — " + zoneAt(t).name + "."
    : "No dives recorded on this device yet.";
}

const DEMO_DATA = (function () {
  try {
    const raw = JSON.parse(document.getElementById("deepcut-demo-data").textContent);
    const v = validateDataset(raw);
    if (!v.ok) throw new Error(v.errors.join(" "));
    return raw;
  } catch (e) {
    return { datasetVersion: "fallback-0", sourceType: "simulated-demo", questions: [{
      id: "fallback", prompt: "Name a fruit.", category: "food", sampleSize: 100,
      answers: [{ canonical: "apple", aliases: ["apples"], count: 40 },
                { canonical: "banana", aliases: ["bananas"], count: 20 },
                { canonical: "dragon fruit", aliases: ["dragonfruit", "pitaya"], count: 2 }],
      knownInvalid: [{ term: "carrot", why: "A carrot is a root vegetable." }] }] };
  }
})();

Store.load();
applySettings();
World.init(document.getElementById("ocean"));
World.reset(Math.floor(Math.random() * 1e9), Store.best(Store.bucket("timed", DEMO_DATA.datasetVersion)));
World.goTo(18);
el.schemaBlock.textContent = SCHEMA_TEXT;
el.scoringNote.textContent = SCORING.label + " (" + SCORING.id + ") — " + SCORING.describe() +
  "; unmeasured answer or timeout " + SCORING.unsupportedPenalty + " m; anchor doubles one round.";
paintBadges(); paintTitle(); paintDataStatus(); buildTutorial(); paintChart();
if (Store.corrupted) msg(el.dataMsg, "Saved records were unreadable and have been reset. Settings restored to defaults.", true);
show("screenTitle");
requestAnimationFrame(frame);

/* Documented public surface. Replacing the bundled demo data needs nothing
   more than this - no rebuild, no code change:
     DEEPCUT.loadDataset(json)   -> {ok, errors}   applies from the next dive
     DEEPCUT.restoreDemo()                         back to the bundled set
     DEEPCUT.datasetFormat()     -> the schema as text
     DEEPCUT.score(percent)      -> metres of depth change
     DEEPCUT.check(questionId, "answer")           how a given answer resolves
*/
window.DEEPCUT = {
  version: "1.0.0",
  loadDataset(json) {
    const data = typeof json === "string" ? JSON.parse(json) : json;
    const v = validateDataset(data);
    if (v.ok) { Store.saveDataset(data); paintDataStatus(); paintBadges(); paintChart(); }
    return v;
  },
  restoreDemo() { Store.clearDataset(); paintDataStatus(); paintBadges(); paintChart(); return true; },
  datasetFormat() { return SCHEMA_TEXT; },
  activeDataset() { return activeDataset(); },
  score(percent) { return SCORING.fromPercent(percent); },
  scoring: SCORING,
  check(questionId, text) {
    const ds = G.dataset || prepareDataset(activeDataset());
    const q = ds.compiled.find(x => x.id === questionId);
    if (!q) return { error: "no such question id" };
    const r = resolveAnswer(q, text, Store.data.settings.typo);
    return {
      kind: r.kind,
      canonical: r.kind === MATCH.HIT ? r.answer.canonical : null,
      percent: r.kind === MATCH.HIT ? r.answer.percent : null,
      change: r.kind === MATCH.HIT ? SCORING.fromPercent(r.answer.percent) : SCORING.unsupportedPenalty,
      corrected: r.corrected || null,
      why: r.why || null,
    };
  },
  /* verification handles - the game does not read these */
  _internals: { G, World, Store, SCORING, MATCH, norm, keysFor, resolveAnswer, prepareDataset, validateDataset, zoneAt, compileQuestion, update },
};

/* Keep a live viewer's dive intact across a republish. */
try {
  window.claude && window.claude.hot && window.claude.hot.snapshot &&
    window.claude.hot.snapshot(() => ({ state: G.state, depth: G.depth, round: G.round }));
} catch (e) {}

</script>
